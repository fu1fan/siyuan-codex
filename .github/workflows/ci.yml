name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:package
      - id: package
        run: node -e "const fs=require('node:fs'); const p=require('./plugin.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'archive='+p.name+'-'+p.version+'.zip\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ steps.package.outputs.archive }}
